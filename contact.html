<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #000; /* black background */
            color: #FFD700; /* strong yellow text */
            padding: 20px;
        }

        /* Back link */
        a {
            color: #FFD700;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #FFD700;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        a:hover {
            background-color: #FFD700;
            color: #000;
        }

        /* Heading */
        h2 {
            text-align: center;
            margin: 20px 0;
        }

        /* Contact info container */
        .contact-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .contact-info p {
            font-size: 16px;
        }

        /* Image */
        .contact-image img {
            width: 120px;
            height: 160px;
            border: 2px solid #FFD700;
            border-radius: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .contact-image img:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #FFD700;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 40px;
            border-top: 1px solid #FFD700;
            padding-top: 10px;
        }

        footer p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <!-- Back link -->
    <a href="a.html">BACK</a>

    <!-- Heading -->
    <h2>Contact Us:</h2>

    <!-- Contact info -->
    <div class="contact-info">
        <p><strong>On WhatsApp:</strong> 0785790885</p>
        <p><strong>On Facebook:</strong> 0789715394</p>
        <p><strong>On Snapchat:</strong> Search "mc jp"</p>
    </div>

    <!-- Image -->
    <div class="contact-image">
        <img src="me.jpg" alt="Contact Image">
    </div>

    <!-- Footer -->
    <footer>
        <p><strong>E-mail:</strong> mcjp182@gmail.com</p>
        <p><strong>Tel:</strong> 0789715384 / 07895790884</p>
    </footer>

</body>
</html>
