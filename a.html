<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drone Systems</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Body background and text */
        body {
            background-color: #000; /* black background for contrast */
            color: #FFD700; /* strong yellow */
            padding: 20px;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .navbar a {
            color: #FFD700;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            padding: 10px 20px;
            border: 2px solid #FFD700;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .navbar a:hover {
            background-color: #FFD700;
            color: #000;
        }

        /* Drone images */
        .drones {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .drones img {
            border: 2px solid #FFD700;
            border-radius: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .drones img:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #FFD700;
        }

        /* Paragraphs */
        p {
            text-align: center;
            margin-bottom: 20px;
            font-size: 16px;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 40px;
            border-top: 1px solid #FFD700;
            padding-top: 10px;
        }
    </style>
</head>
